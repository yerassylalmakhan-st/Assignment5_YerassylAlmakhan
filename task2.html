<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2 - Kanban Board</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <h2 class="mb-4 text-center fw-bold text-dark">📋 Project Kanban Board</h2>
        
        <!-- Search/Filter Input -->
        <div class="row justify-content-center mb-4">
            <div class="col-md-6">
                <input type="text" id="filter-input" class="form-control shadow-sm" placeholder="🔍 Search tasks by tag (e.g., design, backend)...">
            </div>
        </div>

        <div id="no-result-msg" class="text-center text-muted d-none mb-3">No tasks found matching your search tag.</div>

        <!-- Kanban Columns Container (Empty containers filled via DOM) -->
        <div class="row g-4" id="kanban-board">
            <div class="col-md-4">
                <div class="card shadow-sm h-100 border-top border-primary border-4">
                    <div class="card-header bg-white fw-bold text-primary">To Do</div>
                    <div class="card-body bg-light" id="col-todo"></div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm h-100 border-top border-warning border-4">
                    <div class="card-header bg-white fw-bold text-warning">In Progress (Max 3)</div>
                    <div class="card-body bg-light" id="col-inprogress"></div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm h-100 border-top border-success border-4">
                    <div class="card-header bg-white fw-bold text-success">Done</div>
                    <div class="card-body bg-light" id="col-done"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript with defer -->
    <script src="task2.js" defer></script>
</body>
</html>
